<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGBR Chatroom</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.css" />
    <script type="module">
        import 'https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js';
    </script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="anniversary-text">The 5th Anniversary of PGBR</div>
            <div class="nav-links">
                <a href="index.html">Election</a>
                <a href="chatroom.html" class="active">Chatroom</a>
            </div>
        </div>
    </nav>
    
    <div class="chatroom-container">
        <div class="chat-sidebar">
            <div class="chat-users">
                <h3>Online Users</h3>
                <ul class="user-list" id="online-users">
                    <!-- Users will be loaded here -->
                </ul>
            </div>
        </div>
        
        <div class="chat-main">
            <div class="chat-header">
                <h2>PGBR Election Discussion</h2>
            </div>
            
            <div class="messages-container" id="messages-container">
                <!-- Messages will appear here -->
            </div>
            
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea class="chat-input" id="message-input" placeholder="Type a message..." rows="1"></textarea>
                    <div class="emoji-picker-container hidden" id="emoji-picker-container">
                        <emoji-picker id="emoji-picker"></emoji-picker>
                    </div>
                </div>
                
                <div class="chat-controls">
                    <button class="chat-button" id="emoji-button">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M8 14C8 14 9.5 16 12 16C14.5 16 16 14 16 14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M9 9H9.01" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M15 9H15.01" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    
                    <button class="chat-button" id="file-button">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M7 10L12 15L17 10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 15V3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <input type="file" id="file-input" class="file-input" accept="image/*">
                    
                    <button class="chat-button" id="send-button">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 2L11 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="chatroom.js"></script>
</body>
</html>
